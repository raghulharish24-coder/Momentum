<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header>
  <h1>Momentum</h1>
  <p>Small wins, every single day.</p>
</header>

<main class="container">

  <section class="dashboard">
    <h2>Today's Schedule</h2>
    <ul id="schedule-list"></ul>

    <h2>Habits</h2>
    <ul id="habit-list"></ul>
  </section>

  <section class="chat-panel">
    <div id="chat-window">
      <div class="bot-message">Hi! Type help to see everything I can do.</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Type a message...">
      <button id="send-btn">Send</button>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBct5NPU7vMVC-oRjtFxX0duLmfnb6r4WU",
  authDomain: "momentum-23ffd.firebaseapp.com",
  projectId: "momentum-23ffd",
  storageBucket: "momentum-23ffd.firebasestorage.app",
  messagingSenderId: "291885093804",
  appId: "1:291885093804:web:458c10ceec0aa7f5e1a009",
  measurementId: "G-NK11YYC8LM"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let userId = null;
let habits = [];
let schedule = [];

var chatWindow = document.getElementById('chat-window');
var chatInput = document.getElementById('chat-input');
var sendBtn = document.getElementById('send-btn');
var habitList = document.getElementById('habit-list');
var scheduleList = document.getElementById('schedule-list');

auth.signInAnonymously().catch(function(error) {
  console.error('Auth error:', error);
});

auth.onAuthStateChanged(function(user) {
  if (user) {
    userId = user.uid;
    loadData();
  }
});

function loadData() {
  db.collection('users').doc(userId).collection('habits').onSnapshot(function(snapshot) {
    habits = [];
    snapshot.forEach(function(doc) {
      var data = doc.data();
      data.id = doc.id;
      habits.push(data);
    });
    renderDashboard();
  });

  db.collection('users').doc(userId).collection('schedule').onSnapshot(function(snapshot) {
    schedule = [];
    snapshot.forEach(function(doc) {
      var data = doc.data();
      data.id = doc.id;
      schedule.push(data);
    });
    schedule.sort(function(a, b) { return a.time.localeCompare(b.time); });
    renderDashboard();
  });
}

function addMessage(text, sender) {
  var msg = document.createElement('div');
  msg.className = sender === 'user' ? 'user-message' : 'bot-message';
  msg.textContent = text;
  chatWindow.appendChild(msg);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function renderDashboard() {
  habitList.innerHTML = '';
  for (var i = 0; i < habits.length; i++) {
    var li = document.createElement('li');
    li.textContent = habits[i].name + ' - streak: ' + habits[i].streak;
    habitList.appendChild(li);
  }

  scheduleList.innerHTML = '';
  for (var j = 0; j < schedule.length; j++) {
    var li2 = document.createElement('li');
    li2.textContent = schedule[j].time + ' - ' + schedule[j].task;
    scheduleList.appendChild(li2);
  }
}

function getTodayString() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

function findHabit(name) {
  for (var i = 0; i < habits.length; i++) {
    if (habits[i].name.toLowerCase() === name.toLowerCase()) return habits[i];
  }
  return null;
}

function addHabit(name) {
  if (findHabit(name)) return 'You already have a habit called ' + name + '.';
  db.collection('users').doc(userId).collection('habits').add({
    name: name,
    streak: 0,
    lastDone: null
  });
  return 'Added habit: ' + name + '. Type done ' + name + ' when you complete it today.';
}

function deleteHabit(name) {
  var habit = findHabit(name);
  if (!habit) return 'I could not find a habit called ' + name + '.';
  db.collection('users').doc(userId).collection('habits').doc(habit.id).delete();
  return 'Removed habit: ' + name + '.';
}

function streakMessage(streak) {
  if (streak === 3) return ' 3 days strong!';
  if (streak === 7) return ' One full week! Great momentum.';
  if (streak === 30) return ' 30 days! That is a real habit now.';
  if (streak > 0 && streak % 50 === 0) return ' ' + streak + ' days. Incredible consistency.';
  return '';
}

function markHabitDone(name) {
  var habit = findHabit(name);
  if (!habit) return 'I could not find a habit called ' + name + '. Try add habit ' + name + ' first.';

  var today = getTodayString();

  if (habit.lastDone === today) {
    return 'You already marked ' + name + ' as done today. Keep it up!';
  }

  var newStreak = habit.streak + 1;

  if (habit.lastDone) {
    var lastDate = new Date(habit.lastDone);
    var todayDate = new Date(today);
    var diffDays = Math.round((todayDate - lastDate) / (1000 * 60 * 60 * 24));
    if (diffDays > 1) newStreak = 1;
  }

  db.collection('users').doc(userId).collection('habits').doc(habit.id).update({
    lastDone: today,
    streak: newStreak
  });

  return 'Nice work! ' + name + ' streak is now ' + newStreak + '.' + streakMessage(newStreak);
}

function listHabits() {
  if (habits.length === 0) return 'You have no habits yet. Try add habit reading.';
  var text = 'Your habits: ';
  for (var i = 0; i < habits.length; i++) {
    text += habits[i].name + ' (' + habits[i].streak + '), ';
  }
  return text;
}

function addScheduleItem(time, task) {
  db.collection('users').doc(userId).collection('schedule').add({
    time: time,
    task: task
  });
  return 'Scheduled ' + task + ' at ' + time + '.';
}

function removeScheduleItem(task) {
  var found = null;
  for (var i = 0; i < schedule.length; i++) {
    if (schedule[i].task.toLowerCase().indexOf(task.toLowerCase()) !== -1) {
      found = schedule[i];
      break;
    }
  }
  if (!found) return 'I could not find a scheduled task matching ' + task + '.';
  db.collection('users').doc(userId).collection('schedule').doc(found.id).delete();
  return 'Removed ' + found.task + ' from your schedule.';
}

function showSchedule() {
  if (schedule.length === 0) return 'You have nothing scheduled yet. Try schedule 6pm gym.';
  var text = 'Todays plan: ';
  for (var i = 0; i < schedule.length; i++) {
    text += schedule[i].time + ' - ' + schedule[i].task + '. ';
  }
  return text;
}

function showHelp() {
  return 'Commands: add habit [name], done [name], delete habit [name], my habits, schedule [time] [task], remove schedule [task], what is my day.';
}

function handleMessage(rawText) {
  var text = rawText.toLowerCase().trim();

  if (text === 'help') return showHelp();

  if (text.indexOf('hi') === 0 || text.indexOf('hello') === 0 || text.indexOf('hey') === 0) {
    return 'Hey! Type help to see what I can do.';
  }

  if (text.indexOf('delete habit') === 0) {
    var dname = rawText.substring(13).trim();
    if (!dname) return 'Which habit do you want to delete?';
    return deleteHabit(dname);
  }

  if (text.indexOf('add habit') === 0) {
    var name1 = rawText.substring(10).trim();
    if (name1 === '') return 'What habit do you want to add? Try add habit reading.';
    return addHabit(name1);
  }

  if (text.indexOf('my habits') === 0 || text.indexOf('list habits') === 0) {
    return listHabits();
  }

  if (text.indexOf('done') === 0) {
    var name2 = rawText.substring(4).trim();
    if (name2 === '') return 'Which habit is done? Try done reading.';
    return markHabitDone(name2);
  }

  if (text.indexOf('remove schedule') === 0) {
    var rtask = rawText.substring(16).trim();
    if (!rtask) return 'Which scheduled task do you want to remove?';
    return removeScheduleItem(rtask);
  }

  if (text.indexOf('schedule') === 0) {
    var rest = rawText.substring(9).trim();
    var parts = rest.split(' ');
    var time = parts[0];
    var task = parts.slice(1).join(' ');
    if (!time || !task) return 'Try the format: schedule 6pm gym.';
    return addScheduleItem(time, task);
  }

  if (text.indexOf('today') !== -1 || text.indexOf('my day') !== -1) {
    return showSchedule();
  }

  return 'I did not understand that. Type help to see available commands.';
}

function sendMessage() {
  var text = chatInput.value.trim();
  if (text === '') return;
  addMessage(text, 'user');
  chatInput.value = '';

  setTimeout(function() {
    var reply = handleMessage(text);
    addMessage(reply, 'bot');
  }, 300);
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
